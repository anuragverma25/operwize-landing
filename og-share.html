<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #FAF6F0;
    --ink: #241D17;
    --muted-2: #8A7B6D;
    --brand: #2f5743;
    --brand-tint: #e3ebe5;
    --line: #e7ddd0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Hanken Grotesk", -apple-system, sans-serif;
    color: var(--ink);
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }
  /* subtle diagonal hatch texture, top-right */
  .hatch {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(135deg, transparent 0 22px, color-mix(in srgb, var(--ink) 4%, transparent) 22px 24px);
    -webkit-mask-image: radial-gradient(120% 120% at 100% 0%, #000 0%, transparent 55%);
            mask-image: radial-gradient(120% 120% at 100% 0%, #000 0%, transparent 55%);
  }
  .frame {
    position: absolute; inset: 0;
    border: 14px solid var(--brand);
  }
  .pad {
    position: relative; z-index: 2;
    height: 100%;
    padding: 70px 86px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  /* brand lockup */
  .brand { display: inline-flex; align-items: center; gap: 16px; }
  .mark { width: 52px; height: 52px; position: relative; flex: none; }
  .ring { width: 52px; height: 52px; border-radius: 50%; border: 4px solid var(--brand); position: absolute; }
  .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--brand); position: absolute; top: 3px; right: 3px; }
  .name { font-weight: 800; font-size: 34px; letter-spacing: -0.6px; }
  .ai {
    font-size: 18px; font-weight: 800; letter-spacing: 0.8px;
    color: var(--brand); background: var(--brand-tint);
    padding: 3px 9px; border-radius: 7px; margin-left: 8px; vertical-align: 6px;
  }
  /* headline */
  h1 {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 500;
    font-size: 92px;
    line-height: 1.02;
    letter-spacing: -2px;
    max-width: 16ch;
  }
  h1 em { font-style: italic; color: var(--brand); }
  .sub {
    font-size: 26px; color: var(--muted-2); font-weight: 500;
    max-width: 44ch; line-height: 1.4;
  }
  /* footer row */
  .foot { display: flex; align-items: center; justify-content: space-between; }
  .url { font-size: 26px; font-weight: 700; color: var(--brand); letter-spacing: -0.2px; }
  .tag {
    font-family: "Hanken Grotesk", monospace;
    font-size: 16px; letter-spacing: 0.4px; color: var(--muted-2);
    border: 1.5px solid var(--line); border-radius: 999px;
    padding: 9px 18px;
  }
</style>
</head>
<body>
  <div class="hatch"></div>
  <div class="frame"></div>
  <div class="pad">
    <div class="brand">
      <span class="mark"><span class="ring"></span><span class="dot"></span></span>
      <span class="name">Operwize<span class="ai">AI</span></span>
    </div>

    <div>
      <h1 class="serif">Stop reading about AI. <em>Build yours.</em></h1>
      <p class="sub" style="margin-top:26px;">Set up your own AI Operating System in one focused 60-minute session.</p>
    </div>

    <div class="foot">
      <span class="url">www.operwize.co.uk</span>
      <span class="tag">UK small business · in person or on Zoom</span>
    </div>
  </div>
</body>
</html>
